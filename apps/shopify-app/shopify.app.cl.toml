# RASCUNHO SUPERADO — NÃO USE, NÃO DEPLOYE.
#
# ⚠️ Este arquivo já apontou para o app de PRODUÇÃO real "VS BY CLOSET
# Integration" carregando o `client_id` verdadeiro dele, enquanto
# `access_scopes`, `application_url` e `redirect_urls` aqui eram todos
# PLACEHOLDER. Nessa combinação, um `shopify app config use cl` seguido de
# `shopify app deploy` publicaria os placeholders POR CIMA da configuração
# real: os scopes do app de produção seriam zerados e a instalação da loja
# quebraria junto com os webhooks de aluguel. Não é hipótese — o cabeçalho
# de `shopify.app.toml` registra que os scopes já foram zerados uma vez por
# um caminho parecido.
#
# Por isso o `client_id` real foi REMOVIDO daqui. Sem ele, o CLI não
# consegue mais mirar o app de produção a partir deste arquivo.
#
# O conteúdo deste rascunho já foi todo absorvido por
# `shopify.app.production.toml`, que é a ÚNICA configuração válida do app de
# produção: mesmos 4 tópicos de webhook do fluxo de aluguel, com a URL
# pública real do reservations-api (que não existia quando este rascunho foi
# escrito) e com os scopes reais concedidos pela loja.
#
# Se algum dia for preciso uma configuração separada para a loja do Chile,
# NÃO edite este arquivo com o client_id de produção. Crie o app novo no
# Partner Dashboard e rode `shopify app config link` para puxar a config
# real dele — nunca preencha por suposição.
#
# Há uma guarda automatizada em `scripts/checkout-flow.test.mjs` que falha a
# CI se qualquer `shopify.app.*.toml` voltar a carregar o `client_id` de
# produção junto com scopes PLACEHOLDER.

client_id = "REMOVIDO — rascunho superado por shopify.app.production.toml; não aponte este arquivo para o app de produção"
application_url = "PLACEHOLDER — nunca deployar a partir deste arquivo"
embedded = true
name = "VS BY CLOSET Integration (rascunho superado)"

[access_scopes]
# PLACEHOLDER — os scopes reais do app de produção estão em
# `shopify.app.production.toml`. Publicar "PLACEHOLDER" como scope é
# exatamente o acidente que este arquivo causava.
scopes = "PLACEHOLDER"

[webhooks]
api_version = "2026-10"

  # Mantido apenas como registro do que foi pedido na época. A versão que
  # vale, com a URL pública real, está em `shopify.app.production.toml`.
  [[webhooks.subscriptions]]
  uri = "PLACEHOLDER — a assinatura real vive em shopify.app.production.toml"
  topics = [ "orders/create", "orders/paid", "orders/cancelled", "refunds/create" ]

[auth]
redirect_urls = [ "PLACEHOLDER — nunca deployar a partir deste arquivo" ]

[build]
automatically_update_urls_on_dev = true
