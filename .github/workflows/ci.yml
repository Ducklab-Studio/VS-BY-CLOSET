name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Um push novo cancela o build anterior do mesmo branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Typecheck e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @loja/web exec tsc --noEmit

      - name: Lint
        run: pnpm lint
        continue-on-error: true

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          # Placeholder: o build não deve depender da conta real de produção.
          build-args: |
            NEXT_PUBLIC_BOOQABLE_COMPANY=ci-placeholder
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
