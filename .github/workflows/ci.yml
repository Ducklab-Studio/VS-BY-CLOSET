name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Um push novo cancela o build anterior do mesmo branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Typecheck e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @valle/marketing exec tsc --noEmit

      - name: Lint
        run: pnpm lint
        continue-on-error: true

  reservations-api:
    name: API — typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @valle/reservations-api run db:generate

      - name: Typecheck API
        run: pnpm --filter @valle/reservations-api run typecheck

      - name: Testes API
        run: pnpm --filter @valle/reservations-api run test

      - name: Build API
        run: pnpm --filter @valle/reservations-api run build

  build:
    name: Build da vitrine (Next.js)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Placeholder: build não deve depender de credenciais reais de produção.
      - name: Build
        run: pnpm --filter @valle/marketing build
        env:
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ci-placeholder.myshopify.com
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ci-placeholder

  theme-check:
    name: Lint do tema Shopify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: theme
