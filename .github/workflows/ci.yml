name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Um push novo cancela o build anterior do mesmo branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Typecheck e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @valle/marketing exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Checkout flow and legacy guards
        run: node --test scripts/checkout-flow.test.mjs

  reservations-api:
    name: API — typecheck, testes e build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: closet
          POSTGRES_PASSWORD: closet
          POSTGRES_DB: closet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closet -d closet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Banco efêmero do próprio GitHub Actions. Nunca usa o Neon de produção.
      DATABASE_URL: postgresql://closet:closet@localhost:5432/closet_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @valle/reservations-api run db:generate

      - name: Aplicar migrations no Postgres efêmero
        run: pnpm --filter @valle/reservations-api run db:migrate

      - name: Typecheck API
        run: pnpm --filter @valle/reservations-api run typecheck

      - name: Testes API
        run: pnpm --filter @valle/reservations-api run test

      - name: Build API
        run: pnpm --filter @valle/reservations-api run build

  build:
    name: Build da vitrine (Next.js)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Placeholder: build não deve depender de credenciais reais de produção.
      - name: Build
        run: pnpm --filter @valle/marketing build
        env:
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ci-placeholder.myshopify.com
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ci-placeholder

# `theme/` é legado e não participa da aplicação em produção (README.md).
# O Theme Check antigo fazia a CI inteira ficar vermelha por um artefato
# abandonado, enquanto Next/Nest/Prisma passavam. Se o tema voltar a ser
# ativo no futuro, deve ganhar um workflow próprio antes de ser reativado.
