services:
  postgres:
    image: postgres:16-alpine
    container_name: loja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loja_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-loja}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja} -d ${POSTGRES_DB:-loja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache / filas (sessões, rate-limit distribuído, carrinhos abandonados, jobs)
  redis:
    image: redis:7-alpine
    container_name: loja_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
