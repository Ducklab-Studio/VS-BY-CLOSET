# ─────────────────────────────────────────────────────────────────────────────
# Stack de produção.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
#   Internet ──► Caddy :443 ──► web :3000
#                (SSL auto)
#
# Não há banco nem API: o Booqable é o backend. Catálogo, disponibilidade,
# carrinho, checkout, pagamento, clientes e pedidos vivem lá. Este site é a
# camada de marca e conteúdo, e é stateless — pode escalar à vontade.
# ─────────────────────────────────────────────────────────────────────────────

name: valle

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env (ex: valleshowroom.com.br)}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL para os avisos do certificado}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados — perder isso obriga a reemitir
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge, internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        # Variáveis NEXT_PUBLIC_* são embutidas no bundle em tempo de build.
        # Mudar a conta do Booqable exige rebuild, não só restart.
        NEXT_PUBLIC_BOOQABLE_COMPANY: ${BOOQABLE_COMPANY:?defina BOOQABLE_COMPANY no .env}
        NEXT_PUBLIC_BOOQABLE_SCRIPT_URL: ${BOOQABLE_SCRIPT_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks: [internal]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  # Só o Caddy fica nas duas: o container do site não é alcançável de fora.
  edge:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
